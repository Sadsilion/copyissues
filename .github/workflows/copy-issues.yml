name: Copy All Open and Closed Issues

on:
  workflow_dispatch:
    inputs:
      source_owner:
        description: 'Source Repository Owner (username or organization)'
        required: true
        type: string
      source_repo:
        description: 'Source Repository Name'
        required: true
        type: string
      target_owner:
        description: 'Target Repository Owner'
        required: true
        type: string
      target_repo:
        description: 'Target Repository Name'
        required: true
        type: string

jobs:
  copy-all-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy All Issues and Comments via GitHub Script
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CUSTOM_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const sourceOwner = context.payload.inputs.source_owner;
            const sourceRepo = context.payload.inputs.source_repo;
            const targetOwner = context.payload.inputs.target_owner;
            const targetRepo = context.payload.inputs.target_repo;

            console.log(`Fetching all (open and closed) issues from ${sourceOwner}/${sourceRepo}...`);

            // 1. Fetch all issues (both open and closed)
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: sourceOwner,
              repo: sourceRepo,
              state: 'all',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });

            // Filter out pull requests
            const pureIssues = issues.filter(issue => !issue.pull_request);
            console.log(`Found ${pureIssues.length} issues to process.`);

            // 2. Loop through and create each issue in the target repository
            for (const issue of pureIssues) {
              console.log(`Processing issue #${issue.number}: "${issue.title}" [State: ${issue.state}]...`);

              const originalLink = `\n\n*Migrated from [${sourceOwner}/${sourceRepo}#${issue.number}](${issue.html_url})*`;
              const newBody = (issue.body || '') + originalLink;
              const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);

              try {
                // Create the new issue
                const { data: newIssue } = await github.rest.issues.create({
                  owner: targetOwner,
                  repo: targetRepo,
                  title: issue.title,
                  body: newBody,
                  labels: labels,
                });

                // If the source issue was closed, close the target issue too
                if (issue.state === 'closed') {
                  await github.rest.issues.update({
                    owner: targetOwner,
                    repo: targetRepo,
                    issue_number: newIssue.number,
                    state: 'closed'
                  });
                }

                // 3. Fetch and copy comments for this issue
                if (issue.comments > 0) {
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner: sourceOwner,
                    repo: sourceRepo,
                    issue_number: issue.number,
                    per_page: 100
                  });

                  for (const comment of comments) {
                    const commentHeader = `*Originally posted by @${comment.user.login} on ${comment.created_at}*\n\n`;
                    await github.rest.issues.createComment({
                      owner: targetOwner,
                      repo: targetRepo,
                      issue_number: newIssue.number,
                      body: commentHeader + comment.body
                    });
                  }
                  console.log(`-> Copied ${comments.length} comments.`);
                }

                console.log(`-> Successfully created as ${newIssue.html_url}`);
              } catch (error) {
                console.error(`-> Failed to copy issue #${issue.number}: ${error.message}`);
              }
            }

            console.log('Finished copying all issues and comments!');
